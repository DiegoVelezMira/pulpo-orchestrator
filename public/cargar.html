<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cargar · Pulpo</title>
<link rel="stylesheet" href="/pulpo.css">
<style>
  .zona { border:2px dashed var(--strong); border-radius:12px; padding:28px 16px; text-align:center; background:var(--card); }
  .zona.sobre { border-color:var(--accent); background:var(--accent-soft); }
  .fila { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .res { font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>Cargar documentos</h1>
  <div class="zona" id="zona">
    <p><b>Arrastra aquí las facturas</b> en XML o PDF, o <button type="button" id="elegir">elige los archivos</button></p>
    <p class="muted">Hasta 50 por lote y 20 MB en total. Lo que ya estaba registrado se omite sin gastar lectura con IA.</p>
    <input id="archivos" type="file" accept=".xml,.pdf,text/xml,application/xml,application/pdf" multiple hidden>
  </div>
  <div class="card fila" id="elegidos" hidden>
    <span id="cuantos" class="muted"></span>
    <label class="fila"><input type="checkbox" id="reprocesar"> Reprocesar lo cargado que aún no tiene revisión</label>
    <button class="p" id="enviar">Procesar</button>
  </div>
  <div id="msg" hidden></div>
  <div class="card wrapx" id="tabla" hidden>
    <div id="resumen" style="margin-bottom:8px"></div>
    <table><thead><tr><th>Archivo</th><th>Resultado</th><th>Detalle</th></tr></thead><tbody id="filas"></tbody></table>
    <p style="margin-top:10px"><a href="/documentos.html" id="verDocs">Ver los documentos</a></p>
  </div>
</main>
<script src="/pulpo.js"></script>
<script>
(function () {
  var P = window.Pulpo, esc = P.esc;
  var $ = function (id) { return document.getElementById(id); };
  var ctx, files = [], timer = null, fallos = 0;
  var ETQ = { procesado: ['Leído', 'leido'], requiere_revision: ['Necesita ayuda', 'necesita_ayuda'], rechazado: ['Necesita ayuda', 'necesita_ayuda'],
    sin_cliente: ['Necesita ayuda', 'necesita_ayuda'], no_leido: ['Necesita ayuda', 'necesita_ayuda'], en_espera: ['En espera por tope', 'en_espera'],
    duplicado: ['Ya estaba cargado', 'recibido'], error: ['Error', 'necesita_ayuda'], sin_procesar: ['Sin procesar', 'necesita_ayuda'], procesando: ['Procesando…', 'recibido'] };
  function msg(html, cls) { $('msg').className = cls || 'aviso'; $('msg').innerHTML = html; $('msg').hidden = !html; }

  function elegir(lista) {
    files = Array.prototype.filter.call(lista, function (f) { return /\.(xml|pdf)$/i.test(f.name); });
    var omitidos = lista.length - files.length;
    $('elegidos').hidden = !files.length;
    $('cuantos').textContent = files.length + ' archivo(s) listo(s)' + (omitidos ? ' · ' + omitidos + ' omitido(s) por no ser XML ni PDF' : '');
    msg('');
  }
  function leerArchivo(f) {
    return new Promise(function (ok, mal) {
      var r = new FileReader();
      r.onerror = function () { mal(new Error('No se pudo leer ' + f.name)); };
      if (/\.pdf$/i.test(f.name)) { r.onload = function () { ok({ nombre: f.name, base64: String(r.result).split(',')[1] || '' }); }; r.readAsDataURL(f); }
      else { r.onload = function () { ok({ nombre: f.name, contenido: String(r.result) }); }; r.readAsText(f); }
    });
  }

  function enviar() {
    if (!files.length) return;
    if (files.length > 50) return msg('Máximo 50 archivos por lote.');
    if (files.reduce(function (a, f) { return a + f.size; }, 0) > 20 * 1024 * 1024) return msg('Los archivos suman más de 20 MB; divide el lote.');
    $('enviar').disabled = true; msg('Enviando…', 'ok'); $('tabla').hidden = true;
    Promise.all(files.map(leerArchivo)).then(function (archivos) {
      return P.api('/api/crews/contable/lote', { method: 'POST', body: { officeId: ctx.oficinaId, archivos: archivos, reprocesar: $('reprocesar').checked } });
    }).then(function (j) { msg('Procesando… puede tardar un rato; no cierres esta página.', 'ok'); sondear(j.loteId); })
      .catch(function (e) { msg(esc(e.message)); $('enviar').disabled = false; });
  }

  function sondear(loteId) {
    clearInterval(timer); fallos = 0;
    function paso() {
      P.api('/api/crews/contable/lote/' + encodeURIComponent(loteId)).then(function (j) {
        fallos = 0; pintar(j);
        if (j.terminado) {
          clearInterval(timer); $('enviar').disabled = false; files = []; $('elegidos').hidden = true;
          var malos = j.items.filter(function (i) { return i.estado === 'error' || i.estado === 'sin_procesar'; }).length;
          msg(malos ? malos + ' archivo(s) sin procesar: vuelve a subirlos (lo ya procesado se omite).' : 'Lote terminado.', malos ? 'aviso' : 'ok');
        }
      }).catch(function (e) {
        if (e.status === 404) { clearInterval(timer); $('enviar').disabled = false; msg('Se perdió el seguimiento del lote (¿se reinició el servidor?). Vuelve a subir los mismos archivos: lo ya procesado se omite.'); return; }
        if (++fallos >= 3) { clearInterval(timer); $('enviar').disabled = false; msg('Se perdió la conexión: ' + esc(e.message) + '. El lote puede seguir en el servidor; revisa en Documentos.'); }
      });
    }
    paso(); timer = setInterval(paso, 3000);
  }

  function pintar(j) {
    $('tabla').hidden = false;
    var cuenta = {};
    j.items.forEach(function (i) { var k = (ETQ[i.estado] || [i.estado])[0]; cuenta[k] = (cuenta[k] || 0) + 1; });
    $('resumen').innerHTML = '<b>' + j.items.length + ' de ' + j.total + '</b> · ' + esc(Object.keys(cuenta).map(function (k) { return cuenta[k] + ' ' + k.toLowerCase(); }).join(' · ') || '—');
    $('filas').innerHTML = j.items.map(function (i) {
      var e = ETQ[i.estado] || [i.estado, 'recibido'];
      return '<tr><td>' + esc(i.nombre) + '</td><td>' + P.pill(e[1]).replace('>' + esc(P.ESTADOS[e[1]]) + '<', '>' + esc(e[0]) + '<') + '</td><td class="muted res">' + esc(i.detalle || '') + '</td></tr>';
    }).join('');
  }

  P.iniciar('cargar.html').then(function (c) {
    ctx = c;
    if (c.admin) $('verDocs').href = '/documentos.html?oficina=' + c.oficinaId;
    $('elegir').onclick = function () { $('archivos').click(); };
    $('archivos').onchange = function () { elegir($('archivos').files); };
    var z = $('zona');
    ['dragenter', 'dragover'].forEach(function (n) { z.addEventListener(n, function (e) { e.preventDefault(); z.classList.add('sobre'); }); });
    ['dragleave', 'drop'].forEach(function (n) { z.addEventListener(n, function (e) { e.preventDefault(); z.classList.remove('sobre'); }); });
    z.addEventListener('drop', function (e) { elegir(e.dataTransfer.files); });
    $('enviar').onclick = enviar;
  });
})();
</script>
</body>
</html>
