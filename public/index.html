<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oficinas · Pulpo</title>
<link rel="stylesheet" href="/pulpo.css">
<style>
  .cab { display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px 16px; align-items:end; }
  .lista { display:grid; gap:12px; }
  .of { display:grid; gap:10px; }
  .of .t { display:flex; flex-wrap:wrap; justify-content:space-between; gap:6px 16px; align-items:baseline; }
  .conteos { display:flex; flex-wrap:wrap; gap:6px; }
  .fila { display:flex; flex-wrap:wrap; gap:10px; align-items:end; }
  .fila label { display:grid; gap:4px; font-size:13px; color:var(--muted); }
  .barra { height:8px; border-radius:99px; background:var(--subtle); overflow:hidden; max-width:420px; }
  .barra .llena { display:block; height:100%; background:var(--accent); }
  .barra.alto .llena { background:#c47a00; } .barra.agotado .llena { background:var(--bad); }
  .clave { border:1px solid var(--accent); background:var(--accent-soft); border-radius:12px; padding:14px 16px; display:grid; gap:8px; }
  .clave .k { font-family:var(--mono); font-size:20px; letter-spacing:.04em; }
  .estado-ok { color:var(--s-revisado-fg); } .estado-alto { color:#c47a00; } .estado-agotado { color:var(--bad); }
</style>
</head>
<body>
<header class="top"><div class="in"><nav><span class="marca">Pulpo</span><a class="n" href="/" aria-current="page">Oficinas</a></nav>
  <div class="quien"><span>Administrador</span><button type="button" id="salir">Salir</button></div></div></header>
<main>
  <div class="cab"><h1>Oficinas</h1></div>
  <div id="msg" hidden></div>
  <div id="clave" class="clave" hidden></div>
  <details class="card" id="nueva">
    <summary><b>Crear una oficina</b></summary>
    <form class="fila" id="form-nueva" style="margin-top:12px">
      <label>Nombre de la oficina<input id="nnombre" required maxlength="80" autocomplete="off"></label>
      <button class="p" type="submit" id="crear">Crear y generar clave</button>
    </form>
  </details>
  <div class="lista" id="lista"><div class="card vacio">Cargando…</div></div>
</main>
<script src="/pulpo.js"></script>
<script>
(function () {
  var P = window.Pulpo, esc = P.esc;
  var $ = function (id) { return document.getElementById(id); };
  function msg(html, cls) { $('msg').className = cls || 'aviso'; $('msg').innerHTML = html; $('msg').hidden = !html; }

  function mostrarClave(titulo, nombre, id, clave) {
    var enlace = location.origin + '/entrar.html?oficina=' + id;
    var c = $('clave'); c.hidden = false;
    c.innerHTML = '<b>' + esc(titulo) + '</b><div>Oficina: ' + esc(nombre) + '</div><div class="k" id="k">' + esc(clave) + '</div>' +
      '<div class="muted">Anótala ahora: no se vuelve a mostrar. Enlace de entrada para la oficina:</div><div class="mono" id="en">' + esc(enlace) + '</div>' +
      '<div class="fila"><button type="button" id="cp1">Copiar clave</button><button type="button" id="cp2">Copiar enlace</button><button type="button" id="ok">Ya la anoté</button></div>';
    function copiar(txt, b) { try { navigator.clipboard.writeText(txt).then(function () { b.textContent = 'Copiado'; }, function () { b.textContent = 'Selecciona y copia a mano'; }); } catch (e) { b.textContent = 'Selecciona y copia a mano'; } }
    $('cp1').onclick = function () { copiar(clave, $('cp1')); };
    $('cp2').onclick = function () { copiar(enlace, $('cp2')); };
    $('ok').onclick = function () { c.hidden = true; c.innerHTML = ''; };
    c.scrollIntoView({ block: 'nearest' });
  }

  function pintar(lista) {
    if (!lista.length) { $('lista').innerHTML = '<div class="card vacio">Todavía no hay oficinas. Crea la primera arriba.</div>'; return; }
    $('lista').innerHTML = lista.map(function (o) {
      var d = o.documentos || {};
      var pct = o.tope ? Math.min(100, Math.round(100 * o.usados / o.tope)) : 0;
      var topeTxt = o.tope === null ? o.usados + ' PDF leídos con IA este mes · sin tope fijado' :
        '<b>' + o.usados + ' de ' + o.tope + '</b> PDF leídos con IA este mes' + (o.nivel === 'agotado' ? ' · <span class="estado-agotado">tope agotado</span>' : o.nivel === 'alto' ? ' · <span class="estado-alto">tope casi agotado</span>' : '');
      var conteos = ['recibido', 'leido', 'necesita_ayuda', 'en_espera', 'revisado', 'exportado'].filter(function (k) { return d[k]; })
        .map(function (k) { return P.pill(k) + ' <b>' + d[k] + '</b>'; }).join(' ') || '<span class="muted">Sin documentos todavía.</span>';
      return '<section class="card of" data-id="' + o.id + '" data-nombre="' + esc(o.name) + '">' +
        '<div class="t"><h2 style="margin:0">' + esc(o.name) + '</h2><span class="muted mono">oficina ' + o.id + (o.tiene_clave ? '' : ' · sin clave') + '</span></div>' +
        '<div class="conteos">' + conteos + '</div>' +
        '<div>' + topeTxt + '</div>' + (o.tope !== null ? '<div class="barra ' + esc(o.nivel) + '"><span class="llena" data-pct="' + pct + '"></span></div>' : '') +
        '<div class="fila"><label>Tope mensual (PDF con IA)<input type="number" min="0" max="100000" step="1" class="tope" value="' + (o.tope === null ? '' : o.tope) + '" placeholder="Sin tope"></label>' +
        '<button type="button" class="gt">Guardar tope</button>' +
        '<button type="button" class="cc">Cambiar clave</button>' +
        '<a href="/documentos.html?oficina=' + o.id + '">Ver documentos</a></div></section>';
    }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('.llena'), function (l) { l.style.width = l.getAttribute('data-pct') + '%'; });
    Array.prototype.forEach.call(document.querySelectorAll('section.of'), function (s) {
      var id = s.getAttribute('data-id'), nombre = s.getAttribute('data-nombre');
      s.querySelector('.gt').onclick = function () {
        var v = s.querySelector('.tope').value.trim();
        var n = v === '' ? 0 : Number(v);
        if (!Number.isInteger(n) || n < 0) return msg('El tope debe ser un número entero de PDF por mes, o vacío para quitarlo.');
        P.api('/api/admin/oficinas/' + id + '/tope', { method: 'PUT', body: { tope: n } })
          .then(function () { msg('Tope de ' + esc(nombre) + ': ' + (n ? n + ' PDF por mes.' : 'quitado.'), 'ok'); cargar(); })
          .catch(function (e) { msg(esc(e.message)); });
      };
      s.querySelector('.cc').onclick = function () {
        var b = s.querySelector('.cc');
        if (b.getAttribute('data-seguro') !== '1') { b.setAttribute('data-seguro', '1'); b.textContent = 'Confirmar: la clave anterior dejará de servir'; return; }
        P.api('/api/admin/oficinas/' + id + '/clave', { method: 'POST', body: {} })
          .then(function (j) { mostrarClave('Nueva clave generada', nombre, id, j.clave); b.removeAttribute('data-seguro'); b.textContent = 'Cambiar clave'; })
          .catch(function (e) { msg(esc(e.message)); });
      };
    });
  }

  function cargar() {
    return P.api('/api/admin/oficinas').then(pintar).catch(function (e) { $('lista').innerHTML = '<div class="card vacio err">' + esc(e.message) + '</div>'; });
  }

  $('form-nueva').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var nombre = $('nnombre').value.trim(); if (!nombre) return;
    $('crear').disabled = true;
    P.api('/api/admin/oficinas', { method: 'POST', body: { name: nombre } })
      .then(function (j) { $('form-nueva').reset(); $('nueva').open = false; msg('', ''); mostrarClave('Oficina creada', j.name, j.id, j.clave); return cargar(); })
      .catch(function (e) { msg(esc(e.message)); })
      .then(function () { $('crear').disabled = false; });
  });
  $('salir').onclick = function () { fetch('/api/acceso/salir', { method: 'POST' }).then(function () { location.href = '/entrar.html'; }); };

  P.api('/api/acceso/estado').then(function (s) {
    if (s.rol !== 'admin') { location.href = '/documentos.html'; return; }
    cargar();
  });
})();
</script>
</body>
</html>
