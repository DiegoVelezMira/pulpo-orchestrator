<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pulpo — Panel</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --border:#262a33; --text:#e7e9ee;
    --muted:#8b93a3; --accent:#6b8afd; --ok:#4ade80; --warn:#fbbf24;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f7f9; --panel:#ffffff; --border:#e2e5ea; --text:#171a21; --muted:#5b6474; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{padding:20px 24px;border-bottom:1px solid var(--border)}
  header h1{margin:0;font-size:20px}
  header p{margin:4px 0 0;color:var(--muted);font-size:13px}
  main{max-width:960px;margin:0 auto;padding:24px;display:grid;gap:20px}
  .grid{display:grid;grid-template-columns:280px 1fr;gap:20px}
  @media (max-width:720px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px}
  .card h2{margin:0 0 12px;font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  input,textarea,select{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);font:inherit;margin-bottom:8px}
  textarea{min-height:80px;resize:vertical}
  button{padding:9px 14px;border-radius:8px;border:none;background:var(--accent);color:#fff;font:inherit;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  button.secondary{background:transparent;border:1px solid var(--border);color:var(--text)}
  ul{list-style:none;margin:0;padding:0}
  li.office{padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--muted)}
  li.office:hover{background:var(--border)}
  li.office.active{background:var(--accent);color:#fff}
  .task{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
  .task .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:6px}
  .badge{padding:2px 8px;border-radius:999px;font-size:11px}
  .badge.pending{background:rgba(251,191,36,.15);color:var(--warn)}
  .badge.completed{background:rgba(74,222,128,.15);color:var(--ok)}
  .task pre{white-space:pre-wrap;margin:6px 0 0;font:inherit;color:var(--text)}
  .empty{color:var(--muted);font-size:13px;padding:8px 0}
  .row{display:flex;gap:8px}
  .row button{flex:1}
</style>
</head>
<body>
<header>
  <h1>Pulpo</h1>
  <p>Panel mínimo — crear oficinas, clasificar y ejecutar tareas, ver historial</p>
</header>
<main>
  <div class="grid">
    <div class="card">
      <h2>Oficinas</h2>
      <input id="newOfficeName" placeholder="Nombre de la oficina" />
      <button id="createOfficeBtn" style="width:100%">Crear oficina</button>
      <div style="height:12px"></div>
      <ul id="officeList"><li class="empty">Cargando…</li></ul>
    </div>

    <div class="card" id="detail" style="display:none">
      <h2 id="detailTitle">Oficina</h2>

      <div class="card" style="padding:14px;margin-bottom:14px">
        <h2>Nueva tarea (correo)</h2>
        <textarea id="emailContent" placeholder="Pega aquí el contenido del correo o solicitud…"></textarea>
        <button id="classifyBtn">Clasificar y crear tarea</button>
      </div>

      <h2>Tareas</h2>
      <div id="taskList"><div class="empty">Selecciona una oficina</div></div>
    </div>
  </div>
</main>

<script>
let currentOffice = null;

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function loadOffices() {
  const offices = await api("/offices");
  const list = document.getElementById("officeList");
  list.innerHTML = "";
  if (!offices.length) {
    list.innerHTML = '<li class="empty">Sin oficinas todavía</li>';
    return;
  }
  offices.forEach(o => {
    const li = document.createElement("li");
    li.className = "office" + (currentOffice && currentOffice.id === o.id ? " active" : "");
    li.textContent = o.name;
    li.onclick = () => selectOffice(o);
    list.appendChild(li);
  });
}

async function selectOffice(office) {
  currentOffice = office;
  document.getElementById("detail").style.display = "block";
  document.getElementById("detailTitle").textContent = office.name;
  loadOffices();
  loadTasks();
}

async function loadTasks() {
  if (!currentOffice) return;
  const box = document.getElementById("taskList");
  box.innerHTML = '<div class="empty">Cargando…</div>';
  const tasks = await api(`/offices/${currentOffice.id}/tasks`);
  if (!tasks.length) {
    box.innerHTML = '<div class="empty">Sin tareas todavía</div>';
    return;
  }
  box.innerHTML = "";
  tasks.forEach(t => {
    const div = document.createElement("div");
    div.className = "task";
    div.innerHTML = `
      <div class="meta">
        <span>#${t.id} · ${t.agent_type}</span>
        <span class="badge ${t.status}">${t.status}</span>
      </div>
      <pre>${escapeHtml(t.content)}</pre>
      ${t.response ? `<pre style="color:var(--muted);border-top:1px solid var(--border);padding-top:8px;margin-top:8px">${escapeHtml(t.response)}</pre>` : ""}
      ${t.status === "pending" ? `<div style="margin-top:8px"><button class="secondary execBtn" data-id="${t.id}">Ejecutar</button></div>` : ""}
    `;
    box.appendChild(div);
  });
  box.querySelectorAll(".execBtn").forEach(btn => {
    btn.onclick = async () => {
      btn.disabled = true;
      btn.textContent = "Ejecutando…";
      try {
        await api(`/tasks/${btn.dataset.id}/execute`, { method: "POST" });
        loadTasks();
      } catch (e) {
        alert("Error ejecutando la tarea: " + e.message);
        btn.disabled = false;
      }
    };
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

document.getElementById("createOfficeBtn").onclick = async () => {
  const input = document.getElementById("newOfficeName");
  const name = input.value.trim();
  if (!name) return;
  await api("/offices", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name }),
  });
  input.value = "";
  loadOffices();
};

document.getElementById("classifyBtn").onclick = async () => {
  const ta = document.getElementById("emailContent");
  const content = ta.value.trim();
  if (!content || !currentOffice) return;
  const btn = document.getElementById("classifyBtn");
  btn.disabled = true;
  btn.textContent = "Clasificando…";
  try {
    await api("/classify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ officeId: currentOffice.id, emailContent: content }),
    });
    ta.value = "";
    loadTasks();
  } catch (e) {
    alert("Error clasificando: " + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Clasificar y crear tarea";
  }
};

loadOffices();
</script>
</body>
</html>
